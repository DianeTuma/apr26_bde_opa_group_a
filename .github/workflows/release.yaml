name: Continuous Deployment & Release

on:
  push:
    branches:
      - master

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas-ta
          pip install -r requirements.txt

      - name: Create dummy model for tests
        run: |
          python -c "import joblib; joblib.dump({}, 'crypto_model.joblib')"

      - name: Run code validation checks and test suite
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          pytest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push API Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/crypto-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/crypto-api:${{ github.sha }}

      - name: Build and Push Streamlit UI Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.streamlit
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/crypto-streamlit:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/crypto-streamlit:${{ github.sha }}