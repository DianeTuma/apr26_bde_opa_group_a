name: Continuous Deployment & Release

on:
  push:
    branches:
      - master

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install https://github.com/twopirllc/pandas-ta/archive/refs/heads/main.zip
          pip install flake8 pytest pytest-mock fastapi httpx joblib "pandas>=1.5.0,<2.2.0"

      - name: Run code validation checks and test suite
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          pytest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push API Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/crypto-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/crypto-api:${{ github.sha }}

      - name: Build and Push Streamlit UI Image
        uses: docker/build-push-action@v5
        with:
          context: ./streamlit
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/crypto-streamlit:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/crypto-streamlit:${{ github.sha }}