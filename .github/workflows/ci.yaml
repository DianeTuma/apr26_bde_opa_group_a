name: Continuous Integration

on:
  push:
    branches-ignore:
      - 'master'
  pull_request:
    branches:
      - '*'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Linting and Testing Frameworks
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-mock fastapi httpx

      - name: Run Linter (Flake8 Verification)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all other errors as warnings.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run unit test suite
        run: |
          pytest

  smoke-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Test Docker image build (Dry run)
        run: |
          docker compose build --no-cache